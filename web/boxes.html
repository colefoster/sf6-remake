<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SF6 box viewer — per-frame hitboxes and hurtboxes</title>
<style>
  :root {
    --bg: #0e0f13;
    --panel: #16181f;
    --panel-2: #1c1f28;
    --line: #272b36;
    --text: #e8eaf0;
    --dim: #8c93a5;
    --accent: #e23b3b;
    --hit: #ff4d4d;
    --hurt: #4d8cff;
    --prox: #d8b74a;
    --push: #a06cff;
    --throw: #26c99a;
    --opp: #6d7488;
    --plus: #45d17a;
    /* P1's tint in src/game/render.ts. The authored figure is drawn in it, and
       so is everything on this page that points at the authored figure. */
    --authored: #38bdf8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
    padding: 16px 22px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { margin: 0; font-size: 18px; letter-spacing: .02em; }
  header h1 span { color: var(--accent); }
  header .meta { color: var(--dim); font-size: 12.5px; }
  header a { color: var(--dim); font-size: 12.5px; }
  select, button, input[type=number] {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 9px; font: inherit; font-size: 13px;
  }
  button { cursor: pointer; }
  button:hover { border-color: #3a4152; }
  .layout { display: grid; grid-template-columns: 250px 1fr; min-height: calc(100vh - 58px); }
  nav {
    border-right: 1px solid var(--line); background: var(--panel);
    overflow-y: auto; max-height: calc(100vh - 58px); position: sticky; top: 0;
  }
  nav .group {
    padding: 12px 14px 4px; font-size: 11px; text-transform: uppercase;
    letter-spacing: .1em; color: var(--dim);
  }
  nav button {
    display: flex; width: 100%; gap: 8px; align-items: baseline; justify-content: space-between;
    padding: 6px 14px; background: none; border: 0; border-left: 3px solid transparent;
    border-radius: 0; color: var(--text); font: inherit; text-align: left;
  }
  nav button:hover { background: var(--panel-2); }
  nav button[aria-current="true"] { background: var(--panel-2); border-left-color: var(--accent); }
  nav button .in { font-weight: 600; font-variant-numeric: tabular-nums; font-size: 13.5px; }
  nav button .nm { color: var(--dim); font-size: 11.5px; text-align: right; }
  main { padding: 18px 24px 50px; min-width: 0; }
  .title { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; margin-bottom: 4px; }
  .title h2 { margin: 0; font-size: 19px; }
  .title .action { color: var(--dim); font-size: 12.5px; font-family: ui-monospace, monospace; }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 14px; }
  .badge {
    font-size: 11.5px; padding: 2px 8px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--panel-2); color: var(--dim);
  }
  .badge.warn { border-color: #6b4a1e; color: #d8b74a; }
  .stage { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
  canvas { display: block; width: 100%; height: auto; }
  .controls { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin: 12px 0; }
  .controls label { font-size: 12.5px; color: var(--dim); display: flex; gap: 6px; align-items: center; }
  input[type=range] { accent-color: var(--accent); }
  #scrub { flex: 1; min-width: 220px; }
  .frameno { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 84px; }
  /* frame strip */
  .strip { display: flex; gap: 1px; margin: 10px 0 4px; }
  .strip div {
    flex: 1; height: 20px; background: var(--panel-2); border-radius: 2px; cursor: pointer;
    position: relative;
  }
  .strip div.active { background: var(--hit); }
  .strip div.prox { background: #4a4224; }
  .strip div.now { outline: 2px solid var(--text); outline-offset: 1px; z-index: 1; }
  /* The special-cancel window, marked along the bottom edge of the strip. */
  .strip div.cancel::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -4px;
    height: 3px; border-radius: 2px; background: var(--plus);
  }
  /* A keyframe of the authored pose, marked along the top edge at its resolved frame. */
  .strip div.key::before {
    content: ""; position: absolute; left: 0; right: 0; top: -5px;
    height: 4px; border-radius: 2px; background: var(--authored);
  }
  .striplabels { display: flex; justify-content: space-between; color: var(--dim); font-size: 11px; }
  /* The phases the anchors are fractions of, banded across the same span as the strip. */
  .phases { display: flex; gap: 1px; margin: 6px 0 4px; }
  .phases div {
    height: 15px; border-radius: 2px; overflow: hidden; white-space: nowrap;
    font: 10px ui-monospace, monospace; color: #0e0f13; text-align: center; line-height: 15px;
  }
  .phases div.startup { background: #7a6a3a; color: #e8eaf0; }
  .phases div.active { background: var(--hit); }
  .phases div.recovery { background: #3d4354; color: #e8eaf0; }
  .phases div.free { background: #24422f; color: #9fd8b6; }
  /* The mode line: which of the two questions the figure on the canvas answers. */
  .modeline {
    display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap;
    margin: 10px 0 0; padding: 8px 12px; border-radius: 7px;
    border: 1px solid var(--line); background: var(--panel);
    font-size: 12.5px; color: var(--dim);
  }
  .modeline b { font-size: 13.5px; letter-spacing: .02em; }
  .modeline.hittable b { color: #e5e7eb; }
  .modeline.move b { color: var(--authored); }
  .modeline.fallback { border-color: #4a3f1e; }
  .keys { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .keys span {
    font: 11.5px ui-monospace, monospace; padding: 2px 7px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--dim);
  }
  .keys span.on { border-color: var(--authored); color: var(--authored); }
  .keys span.bad { border-color: #6b2a2a; color: var(--hit); }
  /* Eleven authored moves among ~300 actions: findable only if they are marked. */
  nav button.authored .in::after {
    content: "◆"; color: var(--authored); font-size: 10px; margin-left: 6px; vertical-align: 1px;
  }
  .readout {
    margin-top: 16px; display: grid; gap: 10px;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .card h3 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--dim); }
  .card .big { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .card .sub { color: var(--dim); font-size: 12.5px; }
  .yes { color: var(--plus); }
  .no { color: var(--hit); }
  .key { display: flex; gap: 14px; flex-wrap: wrap; color: var(--dim); font-size: 12px; margin-top: 10px; }
  .key i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; }
  footer { color: var(--dim); font-size: 12px; margin-top: 22px; max-width: 900px; }
</style>
</head>
<body>
<header>
  <h1>SF6 <span>box viewer</span></h1>
  <select id="charpick"></select>
  <span class="meta" id="source"></span>
  <a href="index.html">← normals &amp; follow-ups</a>
</header>

<div class="layout">
  <nav id="nav"></nav>
  <main>
    <div class="title">
      <h2 id="movename">—</h2>
      <span class="action" id="actionname"></span>
    </div>
    <div class="badges" id="badges"></div>

    <div class="stage"><canvas id="stage" width="1200" height="620"></canvas></div>

    <div class="modeline hittable" id="modeline">
      <b id="modename">hittable</b>
      <span id="modesub"></span>
    </div>

    <div class="controls">
      <button id="play">▶ Play</button>
      <button id="prev">◀</button>
      <button id="next">▶</button>
      <span class="frameno" id="frameno">frame 1</span>
      <input type="range" id="scrub" min="1" max="1" value="1">
    </div>

    <div class="strip" id="strip"></div>
    <div class="phases" id="phases"></div>
    <div class="striplabels"><span>frame 1</span><span id="striplast"></span></div>
    <div class="keys" id="keys"></div>

    <div class="controls">
      <label>distance <input type="range" id="dist" min="0" max="400" value="120"> <b id="distval">120u</b></label>
      <label>opponent
        <select id="stance">
          <option value="stand">standing</option>
          <option value="crouch">crouching</option>
          <option value="none">none</option>
        </select>
      </label>
      <label><input type="checkbox" id="t-hurt" checked> hurtboxes</label>
      <label><input type="checkbox" id="t-hit" checked> hitboxes</label>
      <label><input type="checkbox" id="t-prox"> proximity</label>
      <label><input type="checkbox" id="t-push" checked> pushboxes</label>
      <label><input type="checkbox" id="t-path" checked> travel path</label>
      <label><input type="checkbox" id="t-figure" checked> figure</label>
      <label>figure shows
        <select id="mode">
          <option value="hittable">hittable — derived from the boxes</option>
          <option value="move">move — the authored pose</option>
        </select>
      </label>
      <label>speed
        <select id="fps">
          <option value="60">60fps (real time)</option>
          <option value="30">30fps</option>
          <option value="20">20fps</option>
          <option value="10">10fps</option>
        </select>
      </label>
      <label>they <select id="guard"><option value="block">block</option><option value="hit">get hit</option></select></label>
      <button id="fit">snap to max range</button>
    </div>

    <div class="readout">
      <div class="card">
        <h3>This frame</h3>
        <div class="big" id="r-frame">—</div>
        <div class="sub" id="r-frame-sub"></div>
      </div>
      <div class="card">
        <h3>Connects at this distance</h3>
        <div class="big" id="r-connect">—</div>
        <div class="sub" id="r-connect-sub"></div>
      </div>
      <div class="card">
        <h3>Usable spacing</h3>
        <div class="big" id="r-range">—</div>
        <div class="sub" id="r-range-sub"></div>
      </div>
      <div class="card">
        <h3>Frames</h3>
        <div class="big" id="r-frames">—</div>
        <div class="sub" id="r-frames-sub"></div>
      </div>
      <div class="card">
        <h3>On contact</h3>
        <div class="big" id="r-hit">—</div>
        <div class="sub" id="r-hit-sub"></div>
      </div>
      <div class="card">
        <h3>Outcome at this spacing</h3>
        <div class="big" id="r-adv">—</div>
        <div class="sub" id="r-adv-sub"></div>
      </div>
    </div>

    <div class="key">
      <span><i style="background:var(--hit)"></i>hitbox</span>
      <span><i style="background:var(--hurt)"></i>hurtbox</span>
      <span><i style="background:var(--throw)"></i>throwable / throw box</span>
      <span><i style="background:var(--prox)"></i>proximity guard</span>
      <span><i style="background:var(--push)"></i>pushbox</span>
      <span><i style="background:var(--opp)"></i>opponent</span>
      <span><i style="background:var(--authored)"></i>authored figure — invention, not derived</span>
    </div>

    <footer id="footer"></footer>
  </main>
</div>

<script type="module">
/*
 * Renders the geometry extracted by scripts/extract-geometry.mjs.
 *
 * Boxes are game units: x = 0 is the character origin, y = 0 the ground, +x
 * forward. The attacker stands at x = 0 facing right; the opponent stands at
 * x = distance facing left, so its boxes are mirrored about its own origin.
 *
 * Every box, window and distance below is read through `./play.js` — the same
 * bundle of `src/game` and `src/data/geometry` that `play.html` runs. This page
 * used to carry its own copy of all of it (`hurtAt`, `originAt`, `activeWindows`,
 * `maxReach`, `connectFrames`, and a canvas transform), which is the duplication
 * ADR-0028 removed from the logic layer growing back in the view layer. See
 * ADR-0053.
 *
 * The one thing still computed here is `outcomeAt`: advantage played out from
 * the boxes and the hit table, deliberately *not* taken from `src/sim`, so that
 * comparing it against FAT's published number is a check rather than a
 * restatement.
 */
import {
  actionById, actionableFrame, activeWindows, connectFrames, hitDataFor, hitKeysAt,
  idleHurtboxes, idlePushboxes, minDistance, mirrored, originAt, proxboxesAt,
  pushboxesAt, hurtPartsAt, reach, shift, throwboxesAt,
  boundsOf, drawBox, drawFigure, headRadius, buildOf, poseOf, viewForAction,
  authoredPoseOf, indexPoses, overreach, phasesOf, resolveKeys,
} from "./play.js";

const state = {
  chars: [], data: null, action: null, move: null, frame: 1, playing: false, timer: null,
  distance: 120, stance: "stand", guard: "block",
  show: { hurt: true, hit: true, prox: false, push: true, path: true, figure: true },
  /** The pose chain, rebuilt from frame 1 whenever the frame moves. See ADR-0049. */
  radius: 14,
  build: { arm: 1, leg: 1 },
  /**
   * Which of the two figures is drawn. `hittable` is the derived one this page
   * has always drawn and stays the default: someone who never touches the
   * control sees the caged, graded figure. `move` is the authored library
   * (ADR-0067) and falls back to `hittable` on any action with no file — which
   * is ~290 of them. See ADR-0068.
   */
  mode: "hittable",
  /** Frames per second the play button runs at. The dump's clock is 60. */
  fps: 60,
  /** This character's authored files, keyed by the action each binds to. */
  poses: new Map(),
  /** The file bound to the selected action, and its keys on this action's clock. */
  pose: null,
  resolved: null,
};

/** The whole library, fetched once: `{ "<character>": [PoseFile, ...] }`. */
let library = null;

const $ = (id) => document.getElementById(id);
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

/* ---------- the fighter this page is looking at ---------- */

/** What `poseOf` and the box placement want: an action, a frame, a place to stand. */
const subject = () => subjectAt(state.frame);

const subjectAt = (frame) => ({
  state: { action: state.action, frame, facing: 1 },
  position: () => ({ x: 0, y: 0 }),
});

/**
 * Whether the authored figure is what gets drawn right now.
 *
 * `move` mode alone is not enough: the fallback is the common case. Eleven of
 * this fighter's ~300 actions have a file and the other ~290 fall back to
 * `hittable` silently on the canvas and loudly in the mode line, because a mode
 * that quietly drew nothing would be worse than one that quietly drew the wrong
 * figure.
 */
const authoredHere = () => state.mode === "move" && !!state.pose && !!state.resolved?.keys.length;

/** Hurtboxes for the frame, tagged by part so each draws in its own colour. */
function hurtAt(action, frame) {
  const parts = hurtPartsAt(action, frame);
  const out = [];
  for (const part of ["head", "body", "leg"]) for (const box of parts[part]) out.push({ box, part });
  for (const box of throwboxesAt(action, frame)) out.push({ box, part: "throw" });
  return out;
}

/** The opponent's idle boxes, or none when the viewer is set to no opponent. */
const opponentBoxes = () => (state.stance === "none" ? [] : idleHurtboxes(state.data, state.stance));
const opponentPush = () => (state.stance === "none" ? [] : idlePushboxes(state.data, state.stance));

/**
 * The closest the two origins can be: pushboxes touching. Spacing below this is
 * a position the game cannot produce, so the slider stops there.
 */
function closestDistance() {
  if (state.stance === "none") return 0;
  return minDistance(state.data, state.data, { attacker: "stand", defender: state.stance }) ?? 0;
}

/* ---------- rendering ---------- */

const canvas = $("stage");
const ctx = canvas.getContext("2d");

/**
 * One stable transform per action, so scrubbing doesn't jitter.
 *
 * `viewForAction` is the box viewer's camera, beside `viewFor`'s stage camera in
 * the same module: this page frames one action's own bounds, that one follows
 * two fighters. The floor keeps the fighter's standing height and the opponent
 * in shot whatever the action's boxes do.
 */
function viewFor(action) {
  const floor = {
    minX: -60,
    maxX: Math.max(160, state.distance + 60),
    maxY: state.data.calibration?.standingHeight ?? 170,
  };
  return viewForAction({ width: canvas.width, height: canvas.height }, boundsOf(action, floor));
}

function draw() {
  const action = state.action;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (!action) return;
  const view = viewFor(action);
  const frame = state.frame;

  // ground + origins
  ctx.strokeStyle = "#2f3442";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, view.y(0));
  ctx.lineTo(canvas.width, view.y(0));
  ctx.stroke();
  for (const [x, label] of [[0, "attacker"], [state.distance, "opponent"]]) {
    if (label === "opponent" && state.stance === "none") continue;
    ctx.strokeStyle = "#3a4152";
    ctx.setLineDash([2, 4]);
    ctx.beginPath();
    ctx.moveTo(view.x(x), 0);
    ctx.lineTo(view.x(x), view.y(0));
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = "#6d7488";
    ctx.font = "11px ui-monospace, monospace";
    ctx.fillText(`${label} x=${x}`, view.x(x) + 4, view.y(0) + 14);
  }

  for (const b of opponentBoxes()) drawBox(ctx, view, "opponent", mirrored(b, state.distance));

  const origin = originAt(action, frame);
  drawPath(view, action);

  if (state.show.push) {
    for (const b of opponentPush()) drawBox(ctx, view, "opponent", mirrored(b, state.distance));
    for (const b of pushboxesAt(action, frame)) drawBox(ctx, view, "push", shift(b, origin));
  }
  if (state.show.prox) {
    for (const b of proxboxesAt(action, frame)) drawBox(ctx, view, "prox", shift(b, origin));
  }
  if (state.show.hurt) {
    for (const { box, part } of hurtAt(action, frame)) drawBox(ctx, view, part, shift(box, origin));
  }
  if (state.show.hit) {
    for (const key of hitKeysAt(action, frame)) {
      const kind = key.kind === "projectile" ? "projectile" : key.kind === "throw" ? "throw" : "hit";
      for (const b of key.boxes) drawBox(ctx, view, kind, shift(b, origin));
    }
  }
  // The same figure `play.html` draws, from the same derivation. Free, now that
  // there is one renderer: the boxes were already here.
  //
  // The boxes above are drawn in both modes and from the real data in both. That
  // is what keeps an authored figure honest — a pose disagreeing with its own
  // hitbox is visible while you look at it — and it is the whole authoring aid.
  if (state.show.figure) {
    if (authoredHere()) {
      // Every part of this is invention, so the whole of it goes in the player's
      // tint: `invented` is the sixth argument and it is not decoration.
      const pose = authoredPoseOf(state.pose, subjectAt(frame), state.radius, state.build, {
        resolved: state.resolved,
      });
      if (pose) drawFigure(ctx, view, pose, 0, 0, true);
    } else {
      let pose;
      for (let f = 1; f <= frame; f++) {
        pose = poseOf(subjectAt(f), state.radius, pose, state.build);
      }
      if (pose) drawFigure(ctx, view, pose, 0);
    }
  }

  // scale bar: one metre, taking the standing hurtbox height as the fighter's height
  const height = state.data.calibration?.standingHeight;
  if (height) {
    const x = 30;
    ctx.strokeStyle = "#3a4152";
    ctx.beginPath();
    ctx.moveTo(x, view.y(0));
    ctx.lineTo(x, view.y(height));
    ctx.stroke();
    ctx.fillStyle = "#6d7488";
    ctx.font = "10px ui-monospace, monospace";
    ctx.fillText(`${height}u tall`, x + 5, view.y(height) + 10);
  }
}

/** The trajectory the origin travels, so a dash or jump reads as one shape. */
function drawPath(view, action) {
  const motion = action.motion;
  if (!motion || !state.show.path) return;
  const total = action.frames ?? 0;
  ctx.strokeStyle = "#3f4759";
  ctx.setLineDash([3, 3]);
  ctx.beginPath();
  for (let f = 1; f <= total; f++) {
    const o = originAt(action, f);
    const px = view.x(o.x);
    const py = view.y(o.y);
    if (f === 1) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.stroke();
  ctx.setLineDash([]);
  const now = originAt(action, state.frame);
  ctx.fillStyle = "#8c93a5";
  ctx.beginPath();
  ctx.arc(view.x(now.x), view.y(now.y), 3, 0, Math.PI * 2);
  ctx.fill();
}

/* ---------- readouts ---------- */

function updateReadouts() {
  const action = state.action;
  const opponent = opponentBoxes();
  const frame = state.frame;
  const hits = hitKeysAt(action, frame);
  const here = originAt(action, frame);
  const windows = activeWindows(action);

  const onThisFrame = hits.length
    ? connectFrames(action, opponent, state.distance).includes(frame)
    : null;

  $("r-frame").textContent = hits.length ? "active" : proxboxesAt(action, frame).length ? "proximity" : "no hitbox";
  $("r-frame").className = "big " + (hits.length ? (onThisFrame ? "yes" : "no") : "");
  const at = here.x || here.y ? ` · origin ${round1(here.x)}u forward, ${round1(here.y)}u up` : "";
  $("r-frame-sub").textContent =
    (hits.length
      ? `${hits.length} box group${hits.length > 1 ? "s" : ""} — ` +
        (onThisFrame ? "overlapping the opponent" : "whiffing at this distance")
      : `frame ${frame} of ${action.frames ?? "?"}`) + at;

  const connects = connectFrames(action, opponent, state.distance);
  $("r-connect").textContent = connects.length ? `frames ${ranges(connects)}` : "whiff";
  $("r-connect").className = "big " + (connects.length ? "yes" : "no");
  $("r-connect-sub").textContent = connects.length
    ? `first contact on frame ${connects[0]} at ${state.distance}u`
    : `nothing reaches ${state.distance}u`;

  const far = reach(action, opponent) ?? null;
  const closest = closestDistance();
  $("r-range").textContent = far === null ? "—" : `${Math.round(closest)}-${round1(far)}u`;
  $("r-range-sub").textContent =
    far === null
      ? "no hitbox overlaps the opponent at any distance"
      : `point blank is ${closest}u (pushboxes touching), so ${round1(Math.max(0, far - closest))}u of usable spacing ` +
        `against a ${state.stance === "crouch" ? "crouching" : "standing"} opponent`;

  $("r-frames").textContent = windows.length
    ? windows.map((w) => `${w.start}-${w.end}`).join(", ")
    : "—";
  const startup = windows[0]?.start;
  updateHitData(action);
  updateOutcome(action, opponent);
  $("r-frames-sub").textContent = windows.length
    ? `startup ${startup}, ${windows.reduce((n, w) => n + (w.end - w.start + 1), 0)} active frames` +
      (windows.length > 1 ? ` across ${windows.length} hits` : "")
    : "this action has no hitboxes";
}

const round1 = (n) => Math.round(n * 10) / 10;

/** What the action's first damaging hit does, from the game's outcome table. */
const outcomeTable = (action) => hitDataFor(state.data, action);

function updateHitData(action) {
  const data = outcomeTable(action);
  if (!data?.hit) {
    $("r-hit").textContent = "—";
    $("r-hit-sub").textContent = "this action deals no damage";
    return;
  }
  const { hit, block, counter, punishCounter } = data;
  $("r-hit").textContent = `${hit.damage} dmg`;
  const stuns = [
    `${hit.stun}f hitstun`,
    block ? `${block.stun}f blockstun` : null,
    counter ? `CH ${counter.stun}f` : null,
    punishCounter ? `PC ${punishCounter.stun}f` : null,
  ].filter(Boolean);
  $("r-hit-sub").textContent =
    `${stuns.join(" · ")} — knocks back ${round1(hit.knockback.x)}u over ${hit.knockback.frames}f, ` +
    `${hit.hitStop.owner}f hitstop`;
}

/**
 * Advantage, played out rather than looked up — the browser's half of what
 * src/sim does: contact lands on some active frame, the defender owes its stun
 * (less the four frames of guard release it can act through), and the attacker
 * owes the rest of its own action, from the game's MarginFrame.
 *
 * Nothing published goes into it, which is what makes the comparison below a
 * check rather than a restatement. Keep it in step with `runScenario` in
 * src/sim/index.ts; the Node tests are what actually pin the numbers down.
 */
const GUARD_RELEASE = 4;

function outcomeAt(action, move, opponent, distance) {
  const data = outcomeTable(action);
  const guard = state.guard;
  const outcome = data?.[guard === "block" ? "block" : "hit"];
  const frames = connectFrames(action, opponent, distance);
  const first = activeWindows(action)[0];
  if (!outcome || !frames.length || !first || !move) return null;
  // The shared one now: this page carried a copy that was a frame out on an
  // action ending in the air. See ADR-0012 for the rule itself.
  const free = actionableFrame(action)?.frame;
  if (free === undefined) return null;

  const depth = frames[0] - first.start;
  const defenderFree = outcome.stun - (guard === "block" ? GUARD_RELEASE : 0);
  const attackerFree = free - frames[0];
  const published = guard === "block" ? move.fat.onBlock : move.fat.onHit;
  return {
    contactFrame: frames[0],
    depth,
    advantage: defenderFree - attackerFree,
    published: Number.isFinite(Number(published)) ? Number(published) : null,
    outcome,
  };
}

function updateOutcome(action, opponent) {
  const move = state.data.moves.find((m) => m.action === action.id);
  const result = outcomeAt(action, move, opponent, state.distance);
  if (!result) {
    $("r-adv").textContent = "—";
    $("r-adv").className = "big";
    $("r-adv-sub").textContent = opponent.length
      ? "nothing connects at this distance"
      : "no opponent to connect with";
    return;
  }
  const { advantage, published, depth, contactFrame } = result;
  $("r-adv").textContent = advantage > 0 ? `+${advantage}` : `${advantage}`;
  $("r-adv").className = "big " + (advantage > 0 ? "yes" : advantage < 0 ? "no" : "");
  const agrees = published === null ? "" :
    advantage === published ? ` — matches the published ${published > 0 ? "+" : ""}${published}`
      : ` — published says ${published > 0 ? "+" : ""}${published}`;
  $("r-adv-sub").textContent =
    `contact on frame ${contactFrame}${depth ? `, ${depth} deep (meaty)` : ""}, ` +
    `${state.guard === "block" ? "blocked" : "on hit"}${agrees}`;
}

/** [8,9,10,14] -> "8-10, 14" */
function ranges(frames) {
  const out = [];
  for (const f of frames) {
    const last = out[out.length - 1];
    if (last && f === last[1] + 1) last[1] = f;
    else out.push([f, f]);
  }
  return out.map(([a, b]) => (a === b ? `${a}` : `${a}-${b}`)).join(", ");
}

/**
 * The frame strip, the phase bands under it and the key list under those.
 *
 * Rebuilt on a change of action, not on a change of frame: at 60fps re-creating
 * ninety elements sixty times a second is the difference between a move that
 * plays and a move that stutters. `markNow` is the per-frame half.
 */
function drawStrip() {
  const action = state.action;
  const total = Math.min(action.frames ?? 60, 90);
  const windows = activeWindows(action);
  const strip = $("strip");
  strip.innerHTML = "";
  // Where each key of the authored file landed, by frame. The anchor name goes
  // in the tooltip: judging a pose is as much "did it land on contact" as it is
  // "does it look right", and the resolved frame alone does not say which
  // anchor asked for it.
  const keys = new Map();
  for (const key of state.resolved?.keys ?? []) keys.set(key.frame, key);
  state.cells = [];
  for (let f = 1; f <= total; f++) {
    const cell = document.createElement("div");
    if (windows.some((w) => f >= w.start && f <= w.end)) cell.className = "active";
    else if (proxboxesAt(action, f).length) cell.className = "prox";
    const cancel = state.move?.cancel;
    const cancellable = cancel && f >= cancel.start && f <= cancel.end;
    if (cancellable) cell.classList.add("cancel");
    const key = keys.get(f);
    if (key) cell.classList.add("key");
    cell.title =
      `frame ${f}${cancellable ? " — special-cancellable" : ""}` +
      (key ? ` — authored key: ${anchorName(key.at)}` : "");
    cell.onclick = () => setFrame(f);
    strip.append(cell);
    state.cells.push(cell);
  }
  $("striplast").textContent = `frame ${total}${(action.frames ?? 0) > total ? ` (of ${action.frames})` : ""}`;
  markNow();
  drawPhases(total);
  drawKeyList();
}

/** The one thing that changes per frame. See `drawStrip`. */
function markNow() {
  for (const [i, cell] of (state.cells ?? []).entries()) {
    cell.classList.toggle("now", i + 1 === state.frame);
  }
}

/**
 * The phases the anchors are fractions of — startup, active, recovery, free —
 * from the action's own `MainFrame`, active windows and `MarginFrame`.
 *
 * A key at `["startup", 0.55]` is 55% of the way along the first band and a key
 * at `contact` is on the first frame of the second, and neither is legible from
 * a resolved frame number on its own.
 */
function drawPhases(total) {
  const row = $("phases");
  row.innerHTML = "";
  for (const band of phasesOf(state.action)) {
    if (band.start > total) break;
    const end = Math.min(band.end, total);
    const cell = document.createElement("div");
    cell.className = band.phase;
    cell.style.flex = String(end - band.start + 1);
    const span = band.start === end ? `f${band.start}` : `f${band.start}-${end}`;
    cell.textContent = end - band.start >= 2 ? `${band.phase} ${span}` : "";
    cell.title = `${band.phase} — ${span}`;
    row.append(cell);
  }
}

const anchorName = (at) => (typeof at === "string" ? at : `${at[0]} ${at[1]}`);

/** Every key of the bound file at its resolved frame, and every anchor that did not resolve. */
function drawKeyList() {
  const row = $("keys");
  row.innerHTML = "";
  if (!state.pose) return;
  const pip = (text, cls) => {
    const el = document.createElement("span");
    if (cls) el.className = cls;
    el.textContent = text;
    row.append(el);
  };
  pip(`${state.pose.move} · ${state.resolved.keys.length} keys`);
  for (const key of state.resolved.keys) {
    pip(`f${key.frame} ${anchorName(key.at)}`, key.frame === state.frame ? "on" : "");
  }
  for (const problem of state.resolved.problems) pip(problem, "bad");
  pip(`reach ${overreach(state.resolved.keys, state.build).toFixed(3)} of bone`);
}

/**
 * Which of the two questions the figure on screen is answering, said in words.
 *
 * The spec's rule is that the viewer must always know. It is not enough to
 * colour the figure differently, because the two modes are only comparable if
 * the page says which one you are looking at and — when `move` was asked for on
 * an action with no file — that it did not get it.
 */
function updateModeLine() {
  const line = $("modeline");
  const authored = authoredHere();
  const has = !!state.pose;
  line.className = "modeline " + (authored ? "move" : "hittable") + (state.mode === "move" && !authored ? " fallback" : "");
  $("modename").textContent = authored ? "move — authored pose" : "hittable — derived from the boxes";
  $("modesub").textContent = authored
    ? `Every line of this figure is this project's invention and none of it was read off a box, ` +
      `which is why the whole of it is in the player's tint. The boxes behind it are the game's. ` +
      `From data/poses/${state.data.id}/${state.pose.move}.json.`
    : state.mode === "move"
      ? `No authored pose for ${state.action.name} — falling back to the derived figure. ` +
        `${state.poses.size} of this fighter's ${state.data.counts.actions} actions have one, marked ◆ in the list.`
      : `The figure is derived from this frame's hurtboxes and clamped inside them (ADR-0049). ` +
        (has ? `This action has an authored pose too — switch the mode to see it.` : "");
}

/* ---------- ui wiring ---------- */

function setFrame(f) {
  const total = state.action?.frames ?? 1;
  state.frame = clamp(f, 1, total);
  $("scrub").value = String(state.frame);
  $("frameno").textContent = `frame ${state.frame}`;
  draw();
  updateReadouts();
  markNow();
  drawKeyList();
}

/**
 * What the cancel menu costs, in bars. Drive is six bars of 10000 and super
 * three, which is what makes an EX special read as 2 and a level 3 as SA3.
 */
const BAR = 10000;

function cancelCosts(move) {
  const free = new Set(), drive = new Map(), supers = new Set();
  for (const group of move.cancel.groups) {
    for (const index of state.data.cancelGroups[group] ?? []) {
      const trigger = state.data.triggers[index];
      const target = trigger && actionById(state.data, trigger.action);
      if (!trigger || !target || target.name.startsWith("ATK_")) continue;
      if (trigger.super) supers.add(trigger.super / BAR);
      else if (trigger.drive) drive.set(trigger.drive / BAR, (drive.get(trigger.drive / BAR) ?? new Set()).add(target.id));
      else free.add(target.id);
    }
  }
  return [
    free.size ? `${free.size} free` : null,
    ...[...drive].sort((a, b) => a[0] - b[0]).map(([bars, ids]) => `${ids.size} at ${bars} drive`),
    ...[...supers].sort().map((level) => `SA${level}`),
  ].filter(Boolean).join(" · ");
}

function badge(text, warn) {
  const el = document.createElement("span");
  el.className = "badge" + (warn ? " warn" : "");
  el.textContent = text;
  return el;
}

function selectAction(action, move) {
  state.action = action;
  state.move = move ?? null;
  state.frame = 1;
  // Bound once per action, not once per frame: the anchors resolve against the
  // action's own frame data and that does not change while you scrub.
  state.pose = state.poses.get(action.name) ?? null;
  state.resolved = state.pose ? resolveKeys(state.pose, action) : null;
  $("movename").textContent = move ? `${move.input} — ${move.name}` : action.name;
  $("actionname").textContent = `${action.name}  ·  action ${action.id}${action.mot ? `  ·  ${action.mot}` : ""}`;

  const badges = $("badges");
  badges.innerHTML = "";
  const f = action.flags;
  if (f.low) badges.append(badge("low"));
  if (f.overhead) badges.append(badge("overhead"));
  if (f.high && !f.low) badges.append(badge("high"));
  if (f.fullInvuln) badges.append(badge("full invuln"));
  else if (f.strikeInvuln) badges.append(badge("strike invuln"));
  else if (f.throwInvuln) badges.append(badge("throw invuln"));
  const travel = action.motion?.travel;
  if (travel && (travel.maxX || travel.maxY)) {
    badges.append(
      badge(
        `travels ${round1(travel.maxX)}u forward` + (travel.maxY ? `, ${round1(travel.maxY)}u up` : ""),
      ),
    );
  }
  if (action.continues) {
    const next = actionById(state.data, action.continues);
    badges.append(badge(`spliced with ${next ? next.name : action.continues}`));
  }
  for (const b of action.branches ?? []) {
    const target = actionById(state.data, b.action);
    if (target) badges.append(badge(`branches f${b.frame} → ${target.name}`));
  }
  if (move?.cancel) {
    const { start, end, buffer } = move.cancel;
    badges.append(
      badge(
        `special-cancel f${start}-${end}` + (buffer !== null && buffer < start ? ` (buffered from f${buffer})` : ""),
      ),
    );
    badges.append(badge(cancelCosts(move)));
  }
  if (state.pose) {
    const bad = state.resolved.problems.length;
    badges.append(
      badge(
        `authored pose: ${state.resolved.keys.length} keys` + (bad ? `, ${bad} unresolved` : ""),
        bad > 0,
      ),
    );
  }
  if (move) {
    badges.append(badge(`FAT: startup ${move.fat.startup}, active ${move.fat.active}`));
    if (move.match !== "exact") {
      badges.append(badge(`mapping: ${move.match}${move.startupDelta ? ` (${move.startupDelta > 0 ? "+" : ""}${move.startupDelta}f vs FAT)` : ""}`, true));
    }
  }

  applyDistanceLimits();
  $("scrub").max = String(action.frames ?? 1);
  for (const b of document.querySelectorAll("nav button")) {
    b.setAttribute("aria-current", String(Number(b.dataset.action) === action.id));
  }
  state.frame = 1;
  drawStrip();
  setFrame(1);
  updateModeLine();
}

function buildNav() {
  const nav = $("nav");
  nav.innerHTML = "";
  const data = state.data;
  const mapped = new Set(data.moves.map((m) => m.action));

  const groups = [
    ["Normals", data.moves.filter((m) => m.category === "normal" && !m.input.includes(">"))],
    ["Target combos", data.moves.filter((m) => m.category === "normal" && m.input.includes(">"))],
    ["Specials & supers", data.moves.filter((m) => m.category !== "normal")],
  ];
  for (const [label, moves] of groups) {
    if (!moves.length) continue;
    const head = document.createElement("div");
    head.className = "group";
    head.textContent = label;
    nav.append(head);
    for (const move of moves) {
      const action = actionById(state.data, move.action);
      if (!action) continue;
      nav.append(navButton(action, move, move.input, move.name));
    }
  }

  const rest = data.actions
    .filter((a) => !mapped.has(a.id) && a.hit.some((h) => h.kind !== "proximity"))
    .sort((a, b) => a.name.localeCompare(b.name));
  if (rest.length) {
    const head = document.createElement("div");
    head.className = "group";
    head.textContent = `Unmapped actions with hitboxes (${rest.length})`;
    nav.append(head);
    for (const a of rest) nav.append(navButton(a, null, a.name, `#${a.id}`));
  }
}

function navButton(action, move, primary, secondary) {
  const btn = document.createElement("button");
  btn.dataset.action = String(action.id);
  // Eleven authored moves among ~300 actions. Without the mark they are not
  // findable, and `move` mode reads as broken rather than as unauthored.
  if (state.poses.has(action.name)) {
    btn.classList.add("authored");
    btn.title = `authored pose: ${state.poses.get(action.name).move}`;
  }
  const a = document.createElement("span");
  a.className = "in";
  a.textContent = primary;
  const b = document.createElement("span");
  b.className = "nm";
  b.textContent = secondary ?? "";
  btn.append(a, b);
  btn.onclick = () => selectAction(action, move);
  return btn;
}

async function loadCharacter(id) {
  const res = await fetch(`${id}.boxes.json`);
  state.data = await res.json();
  state.radius = headRadius(state.data);
  state.build = buildOf(state.data);
  // `web/poses.json` is `scripts/build-play.mjs`'s second output: the authored
  // library collected into one object, because `src/data/load-poses.ts` reads a
  // directory and a page cannot. Absent is not an error — it means nothing has
  // been authored, and every action falls back.
  if (library === null) {
    const got = await fetch("poses.json");
    library = got.ok ? await got.json() : {};
  }
  const indexed = indexPoses(library[id] ?? []);
  state.poses = indexed.byAction;
  if (indexed.problems.length) console.warn("pose library:", indexed.problems.join("; "));
  const s = state.data.source;
  $("source").textContent =
    `${state.data.counts.actions} actions · ${state.data.counts.mapped} moves mapped · ` +
    `${state.poses.size} authored pose${state.poses.size === 1 ? "" : "s"} · ${s.geometry}`;
  $("footer").innerHTML =
    `Geometry extracted from MMDK's dump of the game's own collision data; frames from FAT. ` +
    `x = 0 is the character origin, y = 0 the ground, +x forward; ` +
    `${state.data.calibration?.standingHeight ?? "?"} units is this fighter's standing height. ` +
    `Pushboxes set point blank: the distance slider will not go below the point where the two ` +
    `pushboxes touch, because the game cannot put the characters closer than that. ` +
    `Distance is measured from where the attacker stood when the move began, so a move that ` +
    `steps in covers more ground than its boxes alone suggest.`;
  buildNav();
  const first = state.data.moves.find((m) => actionById(state.data, m.action));
  selectAction(actionById(state.data, first.action), first);
}

/** Pushboxes make anything below point blank impossible, so the slider stops there. */
function applyDistanceLimits() {
  const closest = closestDistance();
  $("dist").min = String(closest);
  if (state.distance < closest) {
    state.distance = closest;
    $("dist").value = String(closest);
    $("distval").textContent = `${closest}u`;
  }
}

/**
 * Playback, on a clock rather than on a timer.
 *
 * This ran at a fixed `setInterval(…, 1000 / 20)`, which is a third of the
 * game's rate: a 4-frame startup took 200ms and every authored move read as
 * slower and heavier than it is. The whole point of the authored library is that
 * the timing is the dump's exactly, so the default here is 60 — one action frame
 * per display frame on a 60Hz screen — and `requestAnimationFrame` drives it so
 * a slow draw drops a frame rather than piling up a queue of them.
 */
function play() {
  state.playing = !state.playing;
  $("play").textContent = state.playing ? "❚❚ Pause" : "▶ Play";
  cancelAnimationFrame(state.timer);
  if (!state.playing) return;
  let last = performance.now();
  let owed = 0;
  const step = (now) => {
    if (!state.playing) return;
    owed += ((now - last) * state.fps) / 1000;
    last = now;
    // Never more than four action frames in one paint: a backgrounded tab hands
    // back a two-second delta and the move would jump rather than play.
    const advance = Math.min(4, Math.floor(owed));
    if (advance > 0) {
      owed -= advance;
      const total = state.action?.frames ?? 1;
      let f = state.frame + advance;
      if (f > total) f -= total;
      setFrame(f);
    }
    state.timer = requestAnimationFrame(step);
  };
  state.timer = requestAnimationFrame(step);
}

$("scrub").oninput = (e) => setFrame(Number(e.target.value));
$("play").onclick = play;
$("prev").onclick = () => setFrame(state.frame - 1);
$("next").onclick = () => setFrame(state.frame + 1);
$("dist").oninput = (e) => {
  state.distance = Number(e.target.value);
  $("distval").textContent = `${state.distance}u`;
  draw();
  updateReadouts();
};
$("guard").onchange = (e) => {
  state.guard = e.target.value;
  updateReadouts();
};
$("stance").onchange = (e) => {
  state.stance = e.target.value;
  applyDistanceLimits();
  draw();
  updateReadouts();
};
const TOGGLES = [["hurt", "t-hurt"], ["hit", "t-hit"], ["prox", "t-prox"], ["push", "t-push"], ["path", "t-path"], ["figure", "t-figure"]];
for (const [key, id] of TOGGLES) {
  $(id).onchange = (e) => {
    state.show[key] = e.target.checked;
    draw();
  };
}
$("mode").onchange = (e) => {
  state.mode = e.target.value;
  draw();
  updateModeLine();
};
$("fps").onchange = (e) => {
  state.fps = Number(e.target.value);
};
$("fit").onclick = () => {
  const far = reach(state.action, opponentBoxes());
  if (far === undefined) return;
  state.distance = clamp(far - 1, closestDistance(), Number($("dist").max));
  $("dist").value = String(state.distance);
  $("distval").textContent = `${state.distance}u`;
  draw();
  updateReadouts();
};
document.onkeydown = (e) => {
  if (e.key === "ArrowLeft") setFrame(state.frame - 1);
  else if (e.key === "ArrowRight") setFrame(state.frame + 1);
  else if (e.key === " ") { e.preventDefault(); play(); }
};

(async function init() {
  // extract-geometry.mjs writes boxes-index.json; characters.json is the
  // frame-data site's list and only covers characters that have move art.
  const res = await fetch("boxes-index.json");
  const chars = res.ok ? await res.json() : await (await fetch("characters.json")).json();
  const withGeometry = [];
  for (const c of chars) {
    if ((await fetch(`${c.id}.boxes.json`, { method: "HEAD" })).ok) withGeometry.push(c);
  }
  state.chars = withGeometry;
  const pick = $("charpick");
  for (const c of withGeometry) {
    const opt = document.createElement("option");
    opt.value = c.id;
    opt.textContent = c.name;
    pick.append(opt);
  }
  pick.onchange = () => loadCharacter(pick.value);
  if (withGeometry.length) await loadCharacter(withGeometry[0].id);
})();
</script>
</body>
</html>
